id: put_object_in_container
instruction: 将{target_object}放入{container}，然后松开夹爪。
roles:
  target_object: graspable_object
  container: receptacle
required_capabilities:
- grasp
- place
parameters:
  hold_time: 0.25
  failure_drop: 0.15
  # RoboDojo basket tasks allow the object position up to 1 cm above the rim.
  rim_tolerance: 0.01

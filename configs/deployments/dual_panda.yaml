# Joint/TCP mappings passed physics and FK checks; task reachability remains to be validated.
# Limits: the Franka URDF shipped with the pinned cuRobo version.
id: dual_panda_tabletop
control_type: joint_position
control_dt: 0.05
physics_dt: 0.008333333333333333
capabilities: [grasp, place]
arms:
  left:
    asset: &asset isaaclab_assets.robots.franka:FRANKA_PANDA_CFG
    joint_names: &joints [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    joint_limits: &limits
      - [-2.8973, 2.8973]
      - [-1.7628, 1.7628]
      - [-2.8973, 2.8973]
      - [-3.0718, -0.0698]
      - [-2.8973, 2.8973]
      - [-0.0175, 3.7525]
      - [-2.8973, 2.8973]
    initial_positions: &initial [0.0, -0.569, 0.0, -2.810, 0.0, 3.037, 0.741]
    base_pose: [0.0, 0.4, 0.75, 0.0, 0.0, 0.0, 1.0]
    tcp_frame: panda_hand
    gripper: &gripper
      joint_names: [panda_finger_joint1, panda_finger_joint2]
      command_names: [width]
      command_limits: [[0.0, 0.08]]
      unit: m
      joint_map: [[0.5], [0.5]]
      joint_offset: [0.0, 0.0]
  right:
    asset: *asset
    joint_names: *joints
    joint_limits: *limits
    initial_positions: *initial
    base_pose: [0.0, -0.4, 0.75, 0.0, 0.0, 0.0, 1.0]
    tcp_frame: panda_hand
    gripper: *gripper
# Optical poses: xyz metres + quaternion xyzw, OpenGL (-Z forward, +Y up).
cameras:
  - name: front
    width: 640
    height: 480
    period_steps: 1
    parent_frame: world
    pose: [2.0, 0.0, 1.9, 0.3681179873103491, 0.3681179873103491, 0.6037293660396003, 0.6037293660396003]
  - name: left_wrist
    width: 640
    height: 480
    period_steps: 1
    parent_frame: left/panda_hand
    pose: [0.07, 0, 0.025, 0.680844797956, 0.680844797956, 0.190919776598, 0.190919776598]
    focal_length: 16.0
  - name: right_wrist
    width: 640
    height: 480
    period_steps: 1
    parent_frame: right/panda_hand
    pose: [0.07, 0, 0.025, 0.680844797956, 0.680844797956, 0.190919776598, 0.190919776598]
    focal_length: 16.0

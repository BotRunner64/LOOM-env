# Limits describe the pinned simulation asset; task reachability still needs validation.
id: dual_x5_tabletop
control_type: joint_position
control_dt: 0.05
physics_dt: 0.008333333333333333
capabilities: [grasp, place]
arms:
  left:
    asset: robotwin:x5
    joint_names: &id001 [joint1, joint2, joint3, joint4, joint5, joint6]
    joint_limits: &id002
    - [-10.0, 10.0]
    - [-10.0, 10.0]
    - [-10.0, 10.0]
    - [-10.0, 10.0]
    - [-10.0, 10.0]
    - [-3.14, 3.14]
    initial_positions: &id003 [0, 1.0, 1.2, 0.2, 0, 0]
    base_pose: [0, 0.45, 0.75, 0, 0, 0, 1]
    tcp_frame: link6
    gripper: &id004
      joint_names: [joint7, joint8]
      command_names: [width]
      command_limits:
      - [0, 0.088]
      unit: m
      joint_map:
      - [0.5]
      - [0.5]
      joint_offset: [0, 0]
  right:
    asset: robotwin:x5
    joint_names: *id001
    joint_limits: *id002
    initial_positions: *id003
    base_pose: [0, -0.45, 0.75, 0, 0, 0, 1]
    tcp_frame: link6
    gripper: *id004
# Optical poses: xyz metres + quaternion xyzw, OpenGL (-Z forward, +Y up).
cameras:
  - name: front
    width: 640
    height: 480
    period_steps: 1
    parent_frame: world
    pose: [2.0, 0.0, 1.9, 0.3681179873103491, 0.3681179873103491, 0.6037293660396003, 0.6037293660396003]
  # Asset camera frame: +X forward, +Y left, +Z up; pose converts OpenGL axes.
  - name: left_wrist
    width: 640
    height: 480
    period_steps: 1
    parent_frame: left/camera
    pose: [0, 0, 0, 0.5, -0.5, -0.5, 0.5]
    focal_length: 16.0
  - name: right_wrist
    width: 640
    height: 480
    period_steps: 1
    parent_frame: right/camera
    pose: [0, 0, 0, 0.5, -0.5, -0.5, 0.5]
    focal_length: 16.0

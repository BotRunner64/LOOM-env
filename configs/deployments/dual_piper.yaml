# RoboTwin Piper model; source/version are pinned in embodiments/assets.py.
# Limits and joint axes describe this simulation asset, not a calibrated real arm.
id: dual_piper_tabletop
control_type: joint_position
control_dt: 0.05
physics_dt: 0.008333333333333333
capabilities: [grasp, place]
arms:
  left:
    asset: &asset robotwin:piper
    joint_names: &joints [joint1, joint2, joint3, joint4, joint5, joint6]
    joint_limits: &limits
      - [-2.618, 2.618]
      - [0.0, 3.14]
      - [-2.697, 2.697]
      - [-1.832, 1.832]
      - [-1.22, 1.22]
      - [-3.14, 3.14]
    initial_positions: &initial [0.0, 0.7, -0.7, 0.0, 0.3, 0.0]
    base_pose: [0.0, 0.4, 0.75, 0.0, 0.0, 0.0, 1.0]
    tcp_frame: link6
    gripper: &gripper
      joint_names: [joint7, joint8]
      command_names: [width]
      command_limits: [[0.0, 0.08]]
      unit: m
      joint_map: [[0.5], [0.5]]
      joint_offset: [0.0, 0.0]
  right:
    asset: *asset
    joint_names: *joints
    joint_limits: *limits
    initial_positions: *initial
    base_pose: [0.0, -0.4, 0.75, 0.0, 0.0, 0.0, 1.0]
    tcp_frame: link6
    gripper: *gripper
cameras: []

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-env"
version = "0.1.0.dev0"
description = "Dual-arm manipulation simulation and trajectory data for context-conditioned VLA research"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "PyYAML",
    "h5py",
    "Pillow",
    "imageio",
    "imageio-ffmpeg",
]

[project.optional-dependencies]
# NVIDIA publishes the Sim-compatible Lab wheel; see docs/environment.md.
sim = [
    "torch",
    "isaacsim[all,extscache]>=6",
    "isaaclab[isaacsim]>=3.0.0b2",
    "warp-lang",
    # Convert robot visuals and bake source scene collision meshes.
    "trimesh",
    "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo.git@78fd485fa82d9b9a063fb4985e371814587e666a",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loom_env*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".deps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

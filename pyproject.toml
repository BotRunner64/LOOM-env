[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-env"
version = "0.1.0.dev0"
description = "Dual-arm manipulation simulation and trajectory data for context-conditioned VLA research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.3.1",
    "scipy==1.17.0",
    "PyYAML==6.0.3",
    "h5py==3.16.0",
    "Pillow==12.2.0",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "opencv-python-headless==4.13.0.90",
    "tqdm==4.67.1",
]

[project.optional-dependencies]
# Install with the patched local Isaac Lab packages and NVIDIA/PyTorch indexes.
# See docs/environment.md for the direct pip command.
sim = [
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "torchaudio==2.11.0+cu128",
    "isaacsim[all,extscache]==6.0.1.0",
    # Lab release v3.0.0-beta2.patch1; subpackages have independent versions.
    "isaaclab==6.1.14",
    "isaaclab-assets==0.3.4",
    "isaaclab-physx==1.1.3",
    "isaaclab-ov==0.4.2",
    "isaaclab-visualizers==0.1.0",
    "warp-lang==1.13.0",
    # Additional version pin for Lab's ONNX dependency.
    "onnx==1.20.1",
    "nvidia-curobo[cu12] @ git+https://github.com/NVlabs/curobo.git@4ea77366ca48ee453e7df139e39fa6532af49f3b",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.13.1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["loom_env*"]
namespaces = false

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".deps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
